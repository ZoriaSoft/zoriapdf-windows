[package]
name = "pdf-core"
version = "0.1.0"
edition = "2021"

rust-version = "1.89"
[lib]
name = "pdf_core"
path = "src/lib.rs"

[[bin]]
name = "pdf-worker"
path = "src/bin/pdf-worker.rs"

[dependencies]
pdfium-render = { version = "0.9.4", features = ["image_latest", "thread_safe"] }
lopdf = { version = "0.46", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.41"
getrandom = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Networking_WinHttp", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization"] }
